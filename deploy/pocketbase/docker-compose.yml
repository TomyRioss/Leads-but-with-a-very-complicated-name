services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: leadta-pocketbase
    restart: unless-stopped
    ports:
      - "127.0.0.1:18098:8090"
    env_file:
      - .env
    volumes:
      - ./data:/pb_data
      - ../../pb_migrations:/pb_migrations:ro

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: leadta-app
    restart: unless-stopped
    depends_on:
      - pocketbase
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      NODE_ENV: production
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_SUPERUSER_EMAIL: ${PB_ADMIN_EMAIL}
      POCKETBASE_SUPERUSER_PASSWORD: ${PB_ADMIN_PASSWORD}
